name: Extract pyos Zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip directly to root (no archive folder)
        run: |
          if [ -f "pyos.zip" ]; then
            echo "Extracting pyos.zip directly to root..."
            mkdir -p temp_pyos
            unzip -q "pyos.zip" -d temp_pyos
            
            # If zip contains a pyos folder, take its contents and put to root
            if [ -d "temp_pyos/pyos" ]; then
              echo "Found nested pyos folder, extracting its contents to root"
              cp -r temp_pyos/pyos/* ./
              # Also copy hidden files if any
              cp -r temp_pyos/pyos/.* ./ 2>/dev/null || true
            else
              echo "Flat zip, extracting all to root"
              cp -r temp_pyos/* ./
              cp -r temp_pyos/.* ./ 2>/dev/null || true
            fi
            
            rm -rf temp_pyos
            rm "pyos.zip"
            echo "Done - extracted to root"
            ls -la | head -20
          else
            echo "No pyos.zip found"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract pyos zip directly to root"
          branch: main
